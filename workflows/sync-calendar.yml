name: Publish IJA website and sync Google Calendar

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *' # Every 30 minutes, subject to GitHub schedule delays.

permissions:
  contents: read

concurrency:
  group: ija-site-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calendar parser
        run: python -m pip install -r requirements.txt
      - name: Sync IJA public Google Calendar
        env:
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
        run: python scripts/sync_calendar.py
      - name: Assemble static website
        run: |
          mkdir -p public
          cp index.html events.html donate.html cemetery.html public/
          cp styles.css app.js calendar.js fundraising.js config.js events.json public/
          cp zeffy-thermometer.html manifest.webmanifest service-worker.js public/
          cp -R assets public/assets
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
